[project]
name = "saldora-ai"
version = "0.1.0"
description = "FakturaBot.mk invoice creation + Saldora polite collections MVP"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "httpx>=0.27,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "cryptography>=42,<47",
    "tzdata>=2024.1",
    "passlib>=1.7,<2.0",
    "bcrypt>=4.0,<6.0",
    "python-jose>=3.3,<4.0",
    "pandas>=2.2,<4.0",
    "openpyxl>=3.1,<4.0",
    "reportlab>=4.0,<5.0",
    "python-dotenv>=1.0,<2.0",
    "openai>=1.40,<3.0",
    "google-genai>=1.0,<3.0",
    "resend>=2.0,<3.0",
    "python-telegram-bot>=21.0,<23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.17,<1.0",
]

[tool.vercel]
# Vercel's Python builder imports this module and serves this ASGI app.
entrypoint = "api:app"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
